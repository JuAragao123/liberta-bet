{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>LibertaBET – Apoio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <link rel="stylesheet" href="{% static 'paginainicial.css' %}">

  <style>
    header.topo {
      background-color: #1a1a3d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      width: 100%;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
    }
    .logo .accent { color: #1de9b6; }
    .menu-icon {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    main.conteudo {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .painel {
      background-color: #ffe6ea;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .painel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .painel-header strong {
      font-size: 18px;
      color: #222;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #222;
      cursor: pointer;
      line-height: 1;
    }
    .painel-body {
      margin-top: 12px;
      text-align: left;
    }
    .painel-body p {
      margin-bottom: 12px;
      color: #333;
    }
    .painel-body input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      margin-bottom: 12px;
    }

    .btn-registrar,
    .btn-iniciar {
      display: inline-block;
      background-color: #1a1a3d;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 1em;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      margin-right: 8px;
    }

    .rodape {
      margin-top: 32px;
      font-size: 0.9em;
      color: #555;
    }
    .rodape div {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <header class="topo">
    <div class="logo">LIBERTA <span class="accent">BET</span></div>
    <button class="menu-icon" aria-label="Menu">☰</button>
  </header>

  <main class="conteudo">

    <div class="painel">
      <div class="painel-header">
        <strong>Chat</strong>
        <button class="close-btn" aria-label="Fechar">×</button>
      </div>
      <div class="painel-body">
        <p>Entre em contato conosco</p>
        <input id="chat-input" type="text" placeholder="Digite aqui...">
        <button id="btn-registrar-chat" class="btn-registrar" type="button">
          Registrar
        </button>
      </div>
    </div>

    <div class="painel">
      <div class="painel-header">
        <strong>Autoavaliação</strong>
        <button class="close-btn" aria-label="Fechar">×</button>
      </div>
      <div class="painel-body">
        <p>
          Reflita sobre seu comportamento em relação às apostas. Responder a estas perguntas
          pode ajudar a identificar se você precisa de apoio.
        </p>
        <a href="{% url 'autoavaliacao' %}" class="btn-iniciar">Iniciar</a>
      </div>
    </div>

    <div class="rodape">
      <div><i class="bi bi-instagram"></i>@ia.apostador</div>
      <div><i class="bi bi-link-45deg"></i>https://missaoreviver.com.br</div>
      <div><i class="bi bi-telephone"></i>(21) 99750-3174</div>
    </div>

  </main>

  <script>
    const chatInput = document.getElementById('chat-input');
    const btnRegistrar = document.getElementById('btn-registrar-chat');

    btnRegistrar.addEventListener('click', () => {
      chatInput.value = '';
    });
  </script>
</body>
</html>
