{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libera Bet</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <link rel="stylesheet" href="{% static 'apoio.css' %}">
</head>
<body>

  <nav class="navbar navbar-custom navbar-dark">
    <div class="container-fluid justify-content-between">
      <div class="d-flex align-items-center">
        <img src="https://via.placeholder.com/50x50.png?text=LIBERA+BET" class="me-2" alt="Logo" height="40">
        <button class="btn btn-outline-light d-md-none" type="button">
          <i class="bi bi-list"></i>
        </button>
      </div>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
        <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
      </form>
    </div>
  </nav>


  <div class="container mt-3">

   
    <div class="box">
      <div class="d-flex justify-content-between">
        <strong>Chat</strong>
        <span class="close-btn"><i class="bi bi-x-lg"></i></span>
      </div>
      <p class="mt-2 mb-1">Entre em contato conosco</p>
      <input type="text" class="form-control" placeholder="Digite aqui...">
    </div>


    <div class="box">
      <div class="d-flex justify-content-between">
        <strong>Autoavaliação</strong>
        <span class="close-btn"><i class="bi bi-x-lg"></i></span>
      </div>
      <p class="mt-2 mb-3">
        Reflita sobre seu comportamento em relação às apostas. Responder a estas perguntas pode ajudar a identificar se você precisa de apoio.
      </p>
      <button class="btn-dark-custom">Iniciar</button>
    </div>



    <div class="footer-text">
      <i class="bi bi-instagram"></i>
      <span>@ia.apostador</span>
    </div>
    <div class="footer-text">
      <i class="bi bi-link-45deg"></i>
      <span>https://missaoreviver.com.br</span>
    </div>
    <div class="footer-text">
      <i class="bi bi-telephone"></i>
      <span>(21) 99750 3174</span>
    </div>

    <div class="text-end mt-4">
     
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
