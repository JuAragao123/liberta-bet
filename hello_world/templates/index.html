{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>LibertaBet - Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <header>
        <div class="logo">LIBERTA <span>BET</span></div>
        <nav>
            <input type="text" placeholder="Buscar...">
            <div class="perfil">&#128100;</div>
        </nav>
    </header>

    <main class="login-container">
        <section class="login-box">
            <h2>Entrar na conta</h2>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <label for="email">Email</label>
                <input type="email" id="email" name="usuario" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">Entrar</button>
            </form>

            {% if erro %}
            <p style="color:red; margin-top: 10px;">{{ erro }}</p>
            {% endif %}

            <div class="esqueceu-senha">
                <a href="#">Esqueceu sua senha?</a>
            </div>

            <div class="cadastro-link" style="text-align: center; margin-top: 10px;">
                <a href="{% url 'cadastro' %}">Não tem conta? Cadastre-se</a>
            </div>
        </section>
    </main>

    <button class="botao-emergencia">Emergência</button>
</body>
</html>
