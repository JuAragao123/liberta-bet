<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Progresso - LibertaBET</title>
    <link rel="stylesheet" href="static/progresso_recaida.css">
</head>
<body>
    <header>
        <div class="logo">LIBERTA <span>BET</span></div>
        <nav>
            <input type="text" placeholder="Buscar">
            <div class="perfil">&#128100;</div>
        </nav>
    </header>

    <main class="container">
        <section class="box-escura">
            <h2>Progresso</h2>

            <div class="barra">
                <div class="progresso"></div>
            </div>
            <p class="dias">10 dias</p>

            <div class="diario">
                <label>Diário de recaída</label>
                <input type="text" placeholder="O que aconteceu?">

                <label>Como você estava se sentindo?</label>
                <textarea placeholder="Digite aqui..."></textarea>

                <p class="recaiu-label">Você recaiu?</p>
                <div class="botoes-resposta">
                    <button class="sim">Sim</button>
                    <button class="nao">Não</button>
                </div>
            </div>

            <button class="emergencia">Emergência</button>
        </section>
    </main>
</body>
</html>
